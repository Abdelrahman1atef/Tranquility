name: tranquility
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1


environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  vector_graphics: any
  json_annotation:
  freezed_annotation:
  flutter_bloc:
  flutter_svg:
  flutter_screenutil:
  dio:
  pretty_dio_logger:
  pin_code_fields:
  dotted_border:
  permission_handler:
  image_picker:
  firebase_core:
  firebase_messaging: ^16.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_gen:
  json_serializable:
  device_preview:
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: MysteryQuest
      fonts:
        - asset: assets/fonts/MysteryQuest.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
